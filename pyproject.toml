[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "istrip-plus-cli"
version = "0.5.0"
description = "Command-line tool for controlling iStrip+ BLE lights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
    "pycryptodome>=3.20.0",
]

[project.scripts]
istrip = "istrip.cli:main"

[tool.setuptools.packages.find]
include = ["istrip*"]

[dependency-groups]
dev = [
    # Pinned: ruff's default rule set changes between minor releases, so an
    # unpinned range makes local runs disagree with CI.
    "ruff==0.15.1",
]
