---
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        # Pinned deliberately. Ruff's default rule set changes between
        # minor releases, so an unpinned install makes CI disagree with
        # local runs: 0.16.6 reports errors that 0.15.1 does not.
        run: pip install "ruff==0.15.1"

      - name: ruff check
        run: ruff check istrip/

      - name: ruff format
        run: ruff format --check istrip/
